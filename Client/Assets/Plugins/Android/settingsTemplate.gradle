        }
        maven {
            url "https://developer.huawei.com/repo/" // Assets/Plugins/SolarEngine/Editor/SolarEngineDependencies.xml:18
        }
        maven {
            url "https://developer.hihonor.com/repo/" // Assets/Plugins/SolarEngine/Editor/SolarEngineDependencies.xml:18
        }
        maven {
            url "https://jfrog.anythinktech.com/artifactory/overseas_sdk" // Assets/TpnPlugin/AnyThinkAds/Plugins/Android/NonChina/Editor/Dependencies.xml:5
        }
        maven {
            url (unityProjectPath + "/Assets/GeneratedLocalRepo/Firebase/m2repository") // Assets/Firebase/Editor/AnalyticsDependencies.xml:18, Assets/Firebase/Editor/AppDependencies.xml:22, Assets/Firebase/Editor/CrashlyticsDependencies.xml:20, Assets/Firebase/Editor/MessagingDependencies.xml:24, Assets/Firebase/Editor/RemoteConfigDependencies.xml:20
